<style>
:root{--bg:#101018;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* Mensaje para girar el móvil */
#rotate-overlay {
  position: absolute;
  inset: 0;
  background: rgba(16, 16, 24, 0.97);
  z-index: 100;
  display: flex;

}

  0% { transform: rotate(0deg); }
  50% { transform: rotate(-90deg); }
  100% { transform: rotate(-90deg); }
}

</style></head><body>
<canvas id="c"></canvas>
<input id="nm" maxlength="12" autocomplete="off" spellcheck="false">

<!-- Pantalla de advertencia si la orientación es vertical -->
<div id="rotate-overlay" class="hidden">
  <div class="icon" aria-hidden="true"><span class="phone-shape"></span></div>
  <h2 style="margin:0 0 10px 0; color:#bda4ff;">Gira tu dispositivo</h2>
  <p style="margin:0; font-size: 14px; color:#c9c5d8;">Pon el móvil en horizontal para jugar a Crazy Cars.</p>
</div>

<script>
/* GOLAZO LOCO · MODO HORIZONTAL AUTODETECTABLE */

// ---------- DETECCIÓN Y BLOQUEO DE ORIENTACIÓN ----------
const rotateOverlay = document.getElementById('rotate-overlay');

function checkOrientation() {
  const isPortrait = window.innerHeight > window.innerWidth;
  if (isPortrait) {
    rotateOverlay.classList.remove('hidden');
  } else {
    rotateOverlay.classList.add('hidden');
  }
}

// Intentar bloquear orientación si la API está disponible en móviles
async function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape');
    }
  } catch (e) {}
}

window.addEventListener('resize', () => { resize(); checkOrientation(); });
window.addEventListener('orientationchange', () => { resize(); checkOrientation(); });
document.addEventListener('click', () => { lockLandscape(); }, { once: true });
document.addEventListener('touchstart', () => { lockLandscape(); }, { once: true });

// ---------- DATOS EDITABLES ----------
const DATA = {
  matchSeconds: 90,
  teams: [
    {name:"Racing Valdoria",  c:"#8b5cf6", str:3},
    {name:"Atlético Meridiano",c:"#ffb703", str:4},
    {name:"Unión Costa Azul",c:"#8ac926", str:3},
    {name:"Deportivo Montealto",   c:"#3a86ff", str:5},
    {name:"Sporting Ribera",     c:"#b66dff", str:2},
    {name:"Real Alcántara",       c:"#ff8c42", str:3},
    {name:"Juventud Norte",     c:"#4dd2c0", str:2},
    {name:"Santa Lucía FC",  c:"#e63946", str:4}
  ],
  car:{speed:185, boost:1.45, turn:3.4, dash:380},
  ai:{speed:.9},
  palette:['#8b5cf6','#ffb703','#8ac926','#3a86ff','#b66dff','#ff8c42','#4dd2c0','#f1f1f1'],
  pads:[[220,90,1],[220,610,1],[960,90,1],[960,610,1],[390,350],[790,350],[590,190],[590,510],[260,260],[260,440],[920,260],[920,440]]
};

// ---------- CONSTANTES (Ajustadas a Landscape W=640, H=360) ----------
const BW=640,BH=360,Z=.8;let W=640,H=360,SW=640,VW=W/Z,VH=H/Z;            // pantalla lógica
const WW=1180,WH=700,FX0=90,FX1=1090,FY0=30,FY1=670,CX=590,CY=350; // mundo y campo horizontal
const GY0=265,GY1=435,GD=40,K=60,CR=15,BR=14;       // portería en eje Y (izquierda/derecha)
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wrap=d=>((d+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
let V={s:1,ox:0,oy:0};

function resize(){
  const d=devicePixelRatio||1,cw=document.body.clientWidth,ch=document.body.clientHeight;
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.width=cw*d;cv.height=ch*d;
  W=SW=ch?clamp(BH*cw/ch,BW,800):BW;H=BH;VW=W/Z;VH=H/Z;V.s=Math.min(cw/W,ch/H);V.ox=(cw-W*V.s)/2;V.oy=(ch-H*V.s)/2;
}
resize();
checkOrientation();

// ---------- ESTADO ----------
const S={scene:'menu',time:0,sc:[0,0],freeze:0,msg:'',shake:0,clock:0,rival:1,parts:[],ctrl:null,scored:false,st:100,endAt:0,n:1,gain:0,pt:[],size:3,gtab:0,back:'menu',name:'Piloto'+(100+Math.floor(Math.random()*900)),
  net:{on:false,room:null,code:'',inp:'',host:false,mode:2,me:'',ro:[],msg:'',dn:0,tk:0,age:0,g:0,gid:-1,first:true,pm:0,T:[{name:'Azul',c:'#3a86ff'},{name:'Naranja',c:'#ff8c42'}]},
  car:{body:0,roof:3,wing:4,wheel:6,decal:7,trail:5,shape:0,pat:0}};
const B={x:CX,y:CY,vx:0,vy:0,rot:0},cam={x:0,y:0};
let P=[],SE=null,C={xp:0,lv:1,pts:0,att:{vel:1,gir:1,tur:1},top:5,gt:16};
const I={jx:0,jy:0,kx:0,ky:0,boost:false,drift:false};
const DRIFTS=[];
const stick=()=>{let x=I.jx+I.kx,y=I.jy+I.ky;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return[x,y]};

// ---------- TEMPORADA ----------
function newSeason(){
  const n=8,ids=[...Array(n).keys()],fx=[];let a=ids.slice();
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++)m.push([a[i],a[n-1-i]]);fx.push(m);a.splice(1,0,a.pop())}
  return {round:0,last:'',fix:fx.concat(fx.map(r=>r.map(([h,w])=>[w,h]))),tab:ids.map(()=>({pj:0,gf:0,gc:0,pts:0}))};
}
const KEY='golazoloco_v2_land';
function save(){try{localStorage.setItem(KEY,JSON.stringify({se:SE,n:S.n,c:C,car:S.car,name:S.name}))}catch(e){}}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.se&&d.se.fix.length==14){SE=d.se;S.n=d.n;if(d.c)C=d.c;if(d.car)Object.assign(S.car,d.car);if(d.name)S.name=d.name;return}}catch(e){}
  SE=newSeason();S.n=1;
}
const sorted=()=>SE.tab.map((r,id)=>({...r,id})).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||a.id-b.id);
function rec(h,w,gh,gw){
  const A=SE.tab[h],C=SE.tab[w];A.pj++;C.pj++;A.gf+=gh;A.gc+=gw;C.gf+=gw;C.gc+=gh;
  if(gh>gw)A.pts+=3;else if(gh<gw)C.pts+=3;else{A.pts++;C.pts++}
}
function poi(l){const L=Math.exp(-Math.max(.3,l));let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
const opp=()=>{if(S.mode==='cup')return cupOpp();const m=SE.fix[SE.round].find(x=>x[0]==0||x[1]==0);return m[0]==0?m[1]:m[0]};
function finishMatch(){
  if(S.mode==='cup'){cupFinish();gainXP();save();return}
  for(const [h,w] of SE.fix[SE.round]){
    if(h==0)rec(h,w,S.sc[0],S.sc[1]);else if(w==0)rec(h,w,S.sc[1],S.sc[0]);
    else{const d=(DATA.teams[h].str-DATA.teams[w].str)*.25;rec(h,w,poi(1.6+d),poi(1.6-d))}
  }
  SE.last=S.sc[0]+' - '+S.sc[1]+' vs '+DATA.teams[S.rival].name;SE.round++;gainXP();if(SE.round>=14)endSeason();save();
}
function hubAction(){if(SE.round>=14){SE=newSeason();S.n++;save()}else startMatch()}

// ---------- PARTIDO ----------
function kickoff(){
  const pos=[[[340,CY],[240,CY-110],[240,CY+110]],[[840,CY],[940,CY-110],[940,CY+110]]];
  P=[];
  for(let t=0;t<2;t++)for(let i=0;i<S.size;i++)
    P.push({team:t,i,x:pos[t][i][0],y:pos[t][i][1],sx:pos[t][i][0],sy:pos[t][i][1],sa:t?Math.PI:0,hp:20,dead:0,hc:0,z:0,vz:0,jc:0,vx:0,vy:0,a:t?Math.PI:0,s:0,dash:0,dcd:0,bst:false,st:60});
  Object.assign(B,{x:CX,y:CY,vx:0,vy:0});
  S.ctrl=P[0];S.freeze=3;S.rep=null;REC.length=0;S.scored=false;netCars();updCam(1e3);
}
function startMatch(){
  S.sc=[0,0];S.time=DATA.matchSeconds;S.size=3;S.pt=DATA.pads.map(()=>0);S.rp=[0,0];S.rival=opp();
  kickoff();S.scene='play';S.ot=false;S.lc=9;
}
function updCam(dt){
  const c=S.ctrl,k=Math.min(1,dt*5);
  cam.x+=(clamp(c.x*.6+B.x*.4-VW/2,0,WW-VW)-cam.x)*k;cam.y+=(clamp(c.y*.6+B.y*.4-VH/2,0,WH-VH)-cam.y)*k;
}
function corners(o,r,e){
  for(const[X,Y,ix,iy]of[[FX0,FY0,1,1],[FX1,FY0,-1,1],[FX0,FY1,1,-1],[FX1,FY1,-1,-1]]){
    const d=((o.x-X)*ix+(o.y-Y)*iy)/1.414,d0=K/1.414+r;
    if(d<d0){const nx=ix/1.414,ny=iy/1.414,vn=o.vx*nx+o.vy*ny;o.x+=(d0-d)*nx;o.y+=(d0-d)*ny;
      if(vn<0){o.vx-=(1+e)*vn*nx;o.vy-=(1+e)*vn*ny;return 1}}
  }
  return 0;
}
function steer(p,ang,dt){
  const r=DATA.car.turn*(p.team?1:1+.05*(C.att.gir-1))*(1-.35*Math.min(1,Math.abs(p.s)/250));
  p.a+=clamp(wrap(ang-p.a),-r*dt,r*dt);
}
function drive(p,thr,boost,dt){
  const q=p.team?0:1,mx=DATA.car.speed*(1+(q?.04*(C.att.vel-1):0))*(boost?DATA.car.boost+(q?.03*(C.att.tur-1):0):1);p.bst=boost&&thr>0;
  if(p.dash>0){p.dash-=dt;p.s=DATA.car.dash}else p.s+=(thr*mx-p.s)*Math.min(1,dt*(thr?2.5:4));
  const forwardX=Math.cos(p.a),forwardY=Math.sin(p.a);
  const forwardV=p.vx*forwardX+p.vy*forwardY;
  const lateralV=-p.vx*forwardY+p.vy*forwardX;
  const grip=p.drift?.58:1;
  const k=Math.min(1,dt*(p.drift?2.4:7));
  const targetX=forwardX*p.s-forwardY*lateralV*(1-grip);
  const targetY=forwardY*p.s+forwardX*lateralV*(1-grip);
  p.vx+=(targetX-p.vx)*k;p.vy+=(targetY-p.vy)*k;
  if(p.drift&&Math.abs(lateralV)>28&&Math.abs(p.s)>DATA.car.speed*.35){
    DRIFTS.push({x:p.x-Math.cos(p.a)*9,y:p.y-Math.sin(p.a)*9,a:p.a,side:Math.sign(lateralV)||1,l:1});
    if(DRIFTS.length>150)DRIFTS.shift();
    if(Math.random()<.22)S.parts.push({x:p.x-rnd(-8,8),y:p.y-rnd(-8,8),vx:rnd(-10,10),vy:rnd(-18,18),l:.35,c:'rgba(210,205,225,.25)'});
  }
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  const ox=p.x,oy=p.y;
  p.x=clamp(p.x,FX0+CR,FX1-CR);p.y=clamp(p.y,FY0+CR,FY1-CR);
  if(p.x!=ox||p.y!=oy|corners(p,CR,.2)){if(Math.hypot(p.vx,p.vy)>150)dmg(p);if(p.dash<=0)p.s*=.6}
}
function control(p,dt){
  const [sx,sy]=stick(),m=Math.hypot(sx,sy),bo=I.boost&&p.st>0&&m>.2;p.drift=!!I.drift&&m>.2;
  p.st=clamp(p.st+(bo?-35:3)*dt,0,100);if(p.drift)p.s*=Math.max(0,1-dt*.12);
  if(m>.2)steer(p,Math.atan2(sy,sx),dt);
  const pb=p.bst;drive(p,m>.2?Math.min(1,m*1.2):0,bo,dt);if(p.bst&&!pb)sfx('boost');
}
function fire(){if(S.menuOn||S.paused)return;if(S.net.on&&!S.net.host){if(S.scene==='play'){S.net.dn++;sfx('jump')}return}const p=S.ctrl;if(S.scene==='play'&&S.freeze<=0)jump(p)}
function ai(p,dt){
  if(S.mode==='tut'){p.vx=p.vy=0;p.s=0;return}
  const t=p.team,gx=t?FX0:FX1,ownX=t?FX1:FX0,f=t?[.72,.9,1.05][C.dif|0]:.95;
  const own=P.filter(q=>q.team==t&&q!==S.ctrl&&!q.pid&&!(q.dead>0));let ch=own[0];for(const q of own)if(dist(q,B)<dist(ch,B))ch=q;
  let tx,ty,bo=false;
  if(p===ch){
    const ux=gx-B.x,uy=CY-B.y,un=Math.hypot(ux,uy)||1;
    if((p.x-B.x)*ux+(p.y-B.y)*uy<0){tx=B.x+B.vx*.25;ty=B.y+B.vy*.25;bo=dist(p,B)>140}
    else{tx=B.x-ux/un*40;ty=B.y-uy/un*40}
  }else if(p.i==0){tx=ownX+(B.x-ownX)*.55;ty=CY*.5+B.y*.5}
  else{tx=clamp(B.x+(t?110:-110),FX0+60,FX1-60);ty=(p.i==1?CY-80:CY+80)*.6+B.y*.4}
  const ang=Math.atan2(ty-p.y,tx-p.x),diff=Math.abs(wrap(ang-p.a)),d=Math.hypot(tx-p.x,ty-p.y);
  p.drift=diff>1.05&&Math.abs(p.s)>DATA.car.speed*.4;steer(p,ang,dt);
  
  drive(p,(diff>1.3?.35:1)*(d<24&&p!==ch?0:1)*f,bo,dt);
}

// ---------- BALÓN Y GOLES ----------
function goal(t){
  S.sc[t]++;if(!S.net.on&&t==0&&S.mode!=='tut'){track('goals');if(S.lt&&S.lt.team==0&&S.lt.z>6)track('jg')}S.scored=true;S.freeze=5.2;S.rep={f:REC.slice(),t:0};S.msg='¡GOOOL!';sfx('goal');vib([100,50,200]);say('¡Gooooool de '+TM()[t].name+'!');S.shake=.8;
  const col=TM()[t].c;
  celeb(col);
}
function ballStep(dt){
  if(!S.scored)for(const p of P){
    if(p.dead>0||p.z>25)continue;const dx=B.x-p.x,dy=B.y-p.y,d=Math.hypot(dx,dy)||.01;
    if(d<CR+BR){const nx=dx/d,ny=dy/d;B.vx=p.vx*1.3+nx*90;B.vy=p.vy*1.3+ny*90;B.x=p.x+nx*(CR+BR);B.y=p.y+ny*(CR+BR);S.lt=p;kick()}
  }
  const f=Math.pow(.62,dt);B.vx*=f;B.vy*=f;
  const sp=Math.hypot(B.vx,B.vy);if(sp>680){B.vx*=680/sp;B.vy*=680/sp}
  B.x+=B.vx*dt;B.y+=B.vy*dt;B.rot+=sp*dt/BR;
  if(B.y<FY0+BR){B.y=FY0+BR;B.vy=Math.abs(B.vy)*.8}
  if(B.y>FY1-BR){B.y=FY1-BR;B.vy=-Math.abs(B.vy)*.8}
  corners(B,BR,.8);
  const inM=B.y>GY0&&B.y<GY1;
  for(const left of[1,0]){
    const wx=left?FX0:FX1,sg=left?-1:1,out=(B.x-wx)*sg;
    if(!inM&&out>-BR){B.x=wx-sg*BR;B.vx=-sg*Math.abs(B.vx)*.8}
    else if(inM){
      if(out>GD-BR){B.x=wx+sg*(GD-BR);B.vx*=-.3}
      if(out>0){
        if(B.y<GY0+BR){B.y=GY0+BR;B.vy=Math.abs(B.vy)*.4}
        if(B.y>GY1-BR){B.y=GY1-BR;B.vy=-Math.abs(B.vy)*.4}
      }
      if(out>6&&!S.scored)goal(left?1:0);
    }
  }
}

// ---------- SONIDO, SALTO, REPETICIÓN ----------
let AC=null,MUTE=false;const REC=[],ENG={o:null,g:null,lx:0,ly:0};
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,ty,v,f2){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime((v||.08)*SV(),t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v,fr){const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const o=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=fr||1200;g.gain.value=(v||.2)*SV();o.buffer=b;o.connect(f);f.connect(g);g.connect(AC.destination);o.start()}
function sfx(k){if(!AC||MUTE)return;
  if(k==='hit'){noise(.15,.3,900);tone(130,.12,'sawtooth',.1,50)}
  else if(k==='boom'){noise(.6,.45,500);tone(90,.5,'sawtooth',.15,30)}
  else if(k==='jump')tone(240,.2,'square',.05,560);
  else if(k==='pad'){tone(660,.08,'triangle',.08);setTimeout(()=>tone(990,.12,'triangle',.08),70)}
  else if(k==='beep')tone(520,.18,'square',.07);
  else if(k==='go')tone(880,.45,'square',.09);
  else if(k==='kick')tone(200,.09,'sine',.14,80);
  else if(k==='boost')noise(.25,.18,2500);
  else if(k==='flip')tone(300,.15,'sawtooth',.06,900);
  else if(k==='rep'){tone(440,.1,'triangle',.09);setTimeout(()=>tone(660,.1,'triangle',.09),90);setTimeout(()=>tone(880,.18,'triangle',.09),180)}
  else if(k==='whistle')tone(2300,.6,'sine',.07,2000);
  else if(k==='goal'){noise(1.2,.12,1800);[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.1),i*120))}
}
function engine(dt){
  if(!AC)return;
  if(!ENG.o){const f=AC.createBiquadFilter(),o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=400;g.gain.value=0;o.connect(f);f.connect(g);g.connect(AC.destination);o.start();ENG.o=o;ENG.g=g}
  const c=S.ctrl,on=S.scene==='play'&&c&&!MUTE&&!S.paused&&!(c.dead>0);let sp=0;
  if(c){sp=Math.hypot(c.x-ENG.lx,c.y-ENG.ly)/Math.max(dt,.001);ENG.lx=c.x;ENG.ly=c.y}
  sp=Math.min(sp,330);ENG.o.frequency.value=45+sp*.28*(c&&c.bst?1.3:1);ENG.g.gain.value=(on?.025+sp/300*.03:0)*C.cfg.eng/6;
}
const vib=v=>{try{C.cfg.vib&&navigator.vibrate&&navigator.vibrate(v)}catch(e){}};
function spk(){text(MUTE?'':'',W-24,18,16,'#fff');if(S.scene!=='play')text('MONEDAS '+C.coins,W-44,18,12,'#e9ddff','right');
  if(S.tt>0){const y=S.scene==='play'?H-34:46;pill(W/2-150,y-12,300,24,'rgba(10,12,35,.92)',12);text(S.toast,W/2,y,11,'#e9ddff')}}
function jump(p){if(!p||p.dead>0)return;
  if(p.z>0){if(p.fl||p.z<6)return;p.fl=1;p.fs=.3;const[sx,sy]=p===S.ctrl?stick():[0,0];if(Math.hypot(sx,sy)>.2)p.a=Math.atan2(sy,sx);p.dash=.2;sfx('flip');return}

function update(dt){

  if(S.mode==='tut'&&S.scene==='play'){S.time=999;if(S.freeze<=0)tutStep(dt)}
  S.clock+=dt;S.shake=Math.max(0,S.shake-dt);S.bn=Math.max(0,(S.bn||0)-dt);S.tt=Math.max(0,(S.tt||0)-dt);
  if(S.scene==='play'){if(S.rep&&S.scored&&S.freeze<4)S.rep.t+=dt*.5;
    if(!S.scored){S.ra=(S.ra||0)+dt;if(S.ra>=1/30){S.ra=0;REC.push({b:[B.x,B.y,B.rot],p:P.map(p=>[p.x,p.y,p.a,p.bst,p.z||0,p.dead>0?1:0])});if(REC.length>60)REC.shift()}}}
  for(const q of S.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=400*dt;q.l-=dt}
  S.parts=S.parts.filter(q=>q.l>0);
  netTick(dt);if(S.net.on&&S.scene==='play')return;
  if(S.scene!=='play')return;
  if(S.freeze>0){
    S.freeze-=dt;if(S.scored)ballStep(dt);updCam(dt);
    if(S.freeze<=0){if(S.scored)kickoff();S.msg=''}
    return;
  }
  S.time-=dt;
  if(S.time<=0){if(S.sc[0]==S.sc[1]&&!S.ot){startOT();return}S.time=0;S.scene='end';S.endAt=S.clock;sfx('whistle');say('Final del partido');finishMatch();return}
  let best=null,bd=1e9;
  for(const p of P)if(p.team==0&&!(p.dead>0)){const d=dist(p,B);if(d<bd){bd=d;best=p}}
  if(best&&best!==S.ctrl&&(S.ctrl.dead>0||dist(S.ctrl,B)>bd+30))S.ctrl=best;
  for(const p of P){p.dcd-=dt;p.hc-=dt;p.jc-=dt;air(p,dt);if(p.dead>0){p.dead-=dt;if(p.dead<=0)respawn(p);continue}if(p===S.ctrl)control(p,dt);else ai(p,dt)}
  sep();pads(dt);ballStep(dt);updCam(dt);
}

function peerRoom(code,host){return new Promise((res,rej)=>{
  const hid='crazycars-'+code.toLowerCase(),pr={},mine={},conns={};let myId='',hc=null,done=0,to=null;
  const peer=host?new Peer(hid):new Peer();
  const fail=c=>{if(done)return;done=1;clearTimeout(to);try{peer.destroy()}catch(_){}rej({code:c})};
  const ok=()=>{if(done)return;done=1;clearTimeout(to);res(api)};
  const sendAll=(m,ex)=>{for(const k in conns)if(k!==ex&&conns[k].open)conns[k].send(m)};
  const api={
    presence(o){Object.assign(mine,o);if(host)sendAll({t:'h',p:o});else if(hc&&hc.open)hc.send({t:'p',p:o})},
    peers(){const a=[{peer:myId,isMe:true,sameTab:true,presence:mine}];for(const k in pr)a.push({peer:k,isMe:false,sameTab:false,presence:pr[k]});return a},
    leave(){try{peer.destroy()}catch(_){}}
  };
  to=setTimeout(()=>fail('timeout'),9000);
  peer.on('error',e=>fail(e.type==='unavailable-id'?'taken':e.type==='peer-unavailable'?'notfound':'err'));
  peer.on('open',id=>{myId=id;
    if(host){ok();return}
    hc=peer.connect(hid,{serialization:'json'});
    hc.on('open',()=>{ok();hc.send({t:'p',p:mine})});
    hc.on('data',m=>{
      if(m.t==='full'){for(const k in m.pr)if(k!==myId)pr[k]=m.pr[k]}
      else if(m.t==='h')pr[hid]=Object.assign(pr[hid]||{},m.p);
      else if(m.t==='c'){if(m.id!==myId)pr[m.id]=Object.assign(pr[m.id]||{},m.p)}
      else if(m.t==='bye')delete pr[m.id]});
    hc.on('close',()=>{for(const k in pr)delete pr[k]});
  });
  if(host)peer.on('connection',c=>{
    c.on('open',()=>{conns[c.peer]=c;pr[c.peer]=pr[c.peer]||{};const f={};f[myId]=mine;for(const k in pr)if(k!==c.peer)f[k]=pr[k];c.send({t:'full',pr:f})});
    c.on('data',m=>{if(m.t!=='p')return;pr[c.peer]=Object.assign(pr[c.peer]||{},m.p);const q=Object.assign({},m.p);delete q.i;if(Object.keys(q).length)sendAll({t:'c',id:c.peer,p:q},c.peer)});
    c.on('close',()=>{delete conns[c.peer];delete pr[c.peer];sendAll({t:'bye',id:c.peer})});
  });
})}

function cupFinish(){
  const c=C.cup,a=c.al,r=S.sc[0]-S.sc[1];let won=r>0;S.cupMsg='';

  const w=[];for(let k=0;k<a.length;k+=2){const x=a[k],y=a[k+1];if(x==0||y==0)w.push(won?0:(x==0?y:x));else{const d=DATA.teams[x].str-DATA.teams[y].str;w.push(Math.random()<.5+d*.08?x:y)}}
  if(!won){c.over=1;c.msg='Eliminado en '+['cuartos','semifinales','la final'][c.r]}
  else if(a.length==2){c.over=1;c.champ=1;c.msg='¡CAMPEÓN DE COPA!';C.coins+=200;track('cups')}
  else{c.al=w;c.r++}
  save();
}
